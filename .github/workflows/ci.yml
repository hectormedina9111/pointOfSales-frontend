name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Necesario solo para subir package-lock.json generado al PR (ver el último paso).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: deps
        run: |
          if [ ! -f package-lock.json ]; then
            npm install
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            npm ci
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check translations
        run: node scripts/check-i18n.mjs

      - name: Build Angular
        run: npx ng build

      - name: Build Docker image
        run: docker build -t pos-frontend:ci .

      - name: Commit generated package-lock.json to the PR branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.deps.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add package-lock.json generated by CI"
          git push origin "HEAD:${{ github.head_ref }}"
