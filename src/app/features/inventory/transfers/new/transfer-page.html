<div class="mb-3">
  <h1 class="h3 mb-0">{{ 'inventory.transfers.new.title' | translate }}</h1>
</div>

<app-problem-alert [error]="saveError()" />
<app-problem-alert [error]="draft.lookupError()" />

<app-stepper [saving]="saving()" saveLabelKey="inventory.transfers.send" (finish)="send()" (cancel)="cancel()">
  <app-step labelKey="inventory.transfers.step.destination" [controls]="destinationControls">
    <app-transfer-destination-step />
  </app-step>
  <app-step labelKey="inventory.transfers.step.lines" [controls]="lineControls">
    <app-transfer-lines-step />
  </app-step>
  <app-step labelKey="inventory.transfers.step.summary" [controls]="noControls">
    <app-transfer-summary-step />
  </app-step>
</app-stepper>
