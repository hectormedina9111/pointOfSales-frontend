<div class="modal-header">
  <h2 class="modal-title h5">{{ 'stores.nodes.branch.title' | translate: { number: node?.nodeNumber ?? 0 } }}</h2>
  <button type="button" class="btn-close" [attr.aria-label]="'common.close' | translate" (click)="activeModal.dismiss()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="modal-body">
    <app-problem-alert [error]="lookupError()" />
    <app-problem-alert [error]="error()" />

    @if (lookupsLoading()) {
      <p class="text-body-secondary">{{ 'common.loading' | translate }}</p>
    } @else {
      <label class="form-label" for="store-branch-select">{{ 'stores.nodes.branch.label' | translate }}</label>
      <select id="store-branch-select" class="form-select" formControlName="branchId">
        <option [ngValue]="null">{{ 'stores.nodes.noBranch' | translate }}</option>
        @for (branch of branches(); track branch.id) {
          <option [ngValue]="branch.id">{{ branch.code }} · {{ branch.name }}{{ branch.active ? '' : ' ' + ('common.inactiveSuffix' | translate) }}</option>
        }
      </select>
      <div class="form-text">{{ 'stores.nodes.branch.hint' | translate }}</div>
    }
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">
      {{ 'common.cancel' | translate }}
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="lookupsLoading() || submitting()">
      {{ (submitting() ? 'common.saving' : 'common.save') | translate }}
    </button>
  </div>
</form>
