<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="modal-header">
    <h2 class="modal-title h5">
      {{ (tax === null ? 'catalog.taxes.form.createTitle' : 'catalog.taxes.form.editTitle') | translate }}
    </h2>
    <button type="button" class="btn-close" [attr.aria-label]="'common.close' | translate" (click)="activeModal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <app-problem-alert [error]="lookupError()" />
    <app-problem-alert [error]="error()" />

    @if (lookupsLoading()) {
      <p class="text-body-secondary">{{ 'common.loading' | translate }}</p>
    } @else {
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label" for="tax-country">{{ 'catalog.taxes.field.country' | translate }}</label>
          <select id="tax-country" class="form-select" formControlName="countryId"
            [class.is-invalid]="isInvalid(form.controls.countryId)">
            <option [ngValue]="null">{{ 'common.select' | translate }}</option>
            @for (country of countryOptions(); track country.id) {
              <option [ngValue]="country.id">
                {{ country.isoCode }} - {{ country.name }}{{ country.active ? '' : ' ' + ('common.inactiveSuffix' | translate) }}
              </option>
            }
          </select>
          <app-field-error [control]="form.controls.countryId" />
          @if (tax !== null) {
            <div class="form-text">{{ 'catalog.taxes.hint.countryLocked' | translate }}</div>
          }
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="tax-rate">{{ 'catalog.taxes.field.rate' | translate }}</label>
          <div class="input-group">
            <input id="tax-rate" type="text" inputmode="decimal" class="form-control font-monospace" formControlName="rate"
              [class.is-invalid]="isInvalid(form.controls.rate)" />
            <span class="input-group-text">%</span>
          </div>
          <app-field-error [control]="form.controls.rate" invalidKey="validation.rate" />
          <div class="form-text">{{ 'catalog.taxes.hint.rate' | translate }}</div>
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label" for="tax-code">{{ 'catalog.taxes.field.code' | translate }}</label>
          <input id="tax-code" type="text" class="form-control font-monospace" formControlName="code"
            [class.is-invalid]="isInvalid(form.controls.code)" />
          <app-field-error [control]="form.controls.code" />
        </div>

        <div class="col-12 col-md-8">
          <label class="form-label" for="tax-name">{{ 'catalog.taxes.field.name' | translate }}</label>
          <input id="tax-name" type="text" class="form-control" formControlName="name"
            [class.is-invalid]="isInvalid(form.controls.name)" />
          <app-field-error [control]="form.controls.name" />
        </div>

        <div class="col-12">
          <div class="form-check">
            <input id="tax-active" type="checkbox" class="form-check-input" formControlName="active" />
            <label class="form-check-label" for="tax-active">{{ 'catalog.taxes.field.active' | translate }}</label>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">
      {{ 'common.cancel' | translate }}
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="submitting() || lookupsLoading()">
      {{ (submitting() ? 'common.saving' : 'common.save') | translate }}
    </button>
  </div>
</form>
