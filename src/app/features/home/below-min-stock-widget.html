<div class="card mb-4">
  <div class="card-header d-flex justify-content-between align-items-center gap-2">
    <h2 class="h6 mb-0">{{ 'inventory.belowMin.widget.title' | translate }}</h2>
    <a routerLink="/inventory/stock" [queryParams]="{ belowMin: 'true' }" class="small">
      {{ 'inventory.belowMin.widget.link' | translate }}
    </a>
  </div>
  <div class="card-body">
    <app-problem-alert [error]="error()" />
    @if (count(); as total) {
      <p class="mb-0">
        <span class="h4 me-2" data-testid="below-min-count">{{ total }}</span>
        <span class="text-body-secondary">{{ 'inventory.belowMin.widget.text' | translate }}</span>
      </p>
    } @else if (error() === null) {
      <p class="text-body-secondary mb-0">{{ 'common.loading' | translate }}</p>
    }
  </div>
</div>
