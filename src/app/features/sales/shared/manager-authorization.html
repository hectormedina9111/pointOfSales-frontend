<form [formGroup]="form" novalidate (submit)="$event.preventDefault(); submit()">
  <div class="modal-header">
    <h2 class="modal-title h5">{{ 'sales.pos.authorization.title' | translate }}</h2>
    <button type="button" class="btn-close" [attr.aria-label]="'common.close' | translate" (click)="activeModal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <p class="small text-body-secondary">{{ introKey | translate }}</p>

    <div class="mb-3">
      <app-field-label targetId="manager-username" [required]="true">{{ 'sales.pos.authorization.username' | translate }}</app-field-label>
      <input id="manager-username" type="text" class="form-control" formControlName="username" maxlength="50" autocomplete="off"
        [class.is-invalid]="isInvalid(form.controls.username)" />
      <app-field-error [control]="form.controls.username" />
    </div>

    <div class="mb-0">
      <app-field-label targetId="manager-password" [required]="true">{{ 'sales.pos.authorization.password' | translate }}</app-field-label>
      <input id="manager-password" type="password" class="form-control" formControlName="password" maxlength="200" autocomplete="off"
        [class.is-invalid]="isInvalid(form.controls.password)" />
      <app-field-error [control]="form.controls.password" />
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">{{ 'common.cancel' | translate }}</button>
    <button type="submit" class="btn btn-primary">{{ 'sales.pos.authorization.submit' | translate }}</button>
  </div>
</form>
