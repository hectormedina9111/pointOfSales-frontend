<nav class="d-flex flex-wrap justify-content-between align-items-center gap-2" [attr.aria-label]="'pagination.label' | translate">
  <div class="d-flex align-items-center gap-2">
    <label class="form-label small mb-0" for="pagination-size">{{ 'pagination.pageSize' | translate }}</label>
    <select id="pagination-size" class="form-select form-select-sm w-auto" (change)="sizeSelected($event)">
      @for (option of sizes; track option) {
        <option [value]="option" [selected]="option === size()">{{ option }}</option>
      }
    </select>
  </div>

  <ngb-pagination
    [collectionSize]="total()"
    [page]="page() + 1"
    [pageSize]="size()"
    [maxSize]="5"
    [boundaryLinks]="true"
    [ellipses]="false"
    (pageChange)="pageChange.emit($event - 1)"
  />
</nav>
