# Docker resuelve los nombres de servicio con su DNS interno. Se usa resolver y variables
# para que nginx arranque aunque un backend todavía no esté levantado.
resolver 127.0.0.11 valid=30s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  gzip on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Aplicación Angular: cualquier ruta que no sea un archivo devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Central: /central/api/v1/... se reenvía como /api/v1/... al contenedor central-api.
  location /central/ {
    set $backend http://central-api:8080;
    rewrite ^/central/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Tienda 1: /store1/api/v1/... se reenvía como /api/v1/... al contenedor store1-api.
  location /store1/ {
    set $backend http://store1-api:8080;
    rewrite ^/store1/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Tienda 2: /store2/api/v1/... se reenvía como /api/v1/... al contenedor store2-api.
  location /store2/ {
    set $backend http://store2-api:8080;
    rewrite ^/store2/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
