server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # config.json cambia por nodo y se escribe al arrancar el contenedor: no se guarda en caché.
  location = /config.json {
    add_header Cache-Control "no-cache";
  }

  # Traducciones e index.html cambian con cada versión: el navegador debe revalidarlas
  # siempre, para no mostrar claves nuevas sin traducir con un diccionario viejo.
  location /i18n/ {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Aplicación Angular: cualquier ruta que no sea un archivo devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
